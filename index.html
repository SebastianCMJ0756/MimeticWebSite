<!DOCTYPE html>
<html lang="es" class="h-full bg-black text-slate-100 overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mimetic - IA + Medicina</title>
  <link href="./dist/output.css" rel="stylesheet">
  
  <style>
    .layer-transition {
      transition: all var(--transition-layer-speed) cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="h-full relative font-sans select-none bg-black">

  <!-- FONDO Y CANVAS -->
  <div class="fixed inset-0 z-0 overflow-hidden">
    <canvas id="bg-canvas" class="w-full h-full block"></canvas>
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#0f172a_1px,transparent_1px),linear-gradient(to_bottom,#0f172a_1px,transparent_1px)] bg-[size:4rem_4rem] opacity-20 pointer-events-none"></div>
  </div>

  <!-- NAVEGACIÓN DE PUNTOS LATERALES -->
  <div class="fixed right-8 top-1/2 -translate-y-1/2 z-50 flex flex-col gap-3">
    <button onclick="changeLayer(0)" aria-label="Ir a capa 1" id="dot-0" class="w-3 h-3 rounded-full bg-cyan-400 ring-4 ring-cyan-500/20 transition-all duration-300 cursor-pointer"></button>
    <button onclick="changeLayer(1)" aria-label="Ir a capa 2" id="dot-1" class="w-3 h-3 rounded-full bg-slate-700 transition-all duration-300 cursor-pointer"></button>
    <button onclick="changeLayer(2)" aria-label="Ir a capa 3" id="dot-2" class="w-3 h-3 rounded-full bg-slate-700 transition-all duration-300 cursor-pointer"></button>
  </div>

  <!-- CAPAS DE INFORMACIÓN -->
  <main class="relative z-10 w-full h-full">

    <!-- CAPA 01 (presentacion / portada)-->
    <section id="layer-0" class="layer-transition absolute inset-0 flex flex-col items-center justify-center p-6 text-center opacity-100 scale-100 pointer-events-auto">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyan-500/30 bg-black/60 text-cyan-400 text-xs font-mono tracking-widest mb-4 backdrop-blur-md">
        <span>Gemelo digital en tiempo real</span>
      </div>
      <h1 class="text-5xl md:text-7xl font-black tracking-tight text-white max-w-4xl">
        Mimetic <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
          Replica Virtual Decisiones Reales
        </span>
      </h1>
      <p class="text-slate-400 text-base md:text-lg max-w-xl mt-4 font-light">
        Gemelo Digital para la Gestión Inteligente del Flujo de Pacientes en Hospitales
      </p>
      <div class="mt-12 text-xs font-mono text-cyan-400/70 animate-bounce">
        ↓ Para navegar usa Scroll o las flechas ↓
      </div>
    </section>

    <!-- CAPA 02 (Informacion sobre mimetic)-->
    <section id="layer-1" class="layer-transition absolute inset-0 flex flex-col items-center justify-center p-6 text-center opacity-0 scale-90 pointer-events-none">
      <div class="max-w-2xl bg-black/70 backdrop-blur-xl border border-cyan-500/20 p-8 rounded-2xl shadow-[0_0_50px_rgba(6,182,212,0.15)]">
        <span class="text-xs font-mono text-purple-400 tracking-widest">Que es Mimetic?</span>
        <h2 class="text-3xl md:text-5xl font-bold text-white mt-2">INFORMACION Y DISEÑO PENDIENTE</h2>
        <p class="text-slate-300 mt-4 text-sm md:text-base leading-relaxed">
          
        </p>
      </div>
    </section>

    <!-- CAPA 03 -->
    <section id="layer-2" class="layer-transition absolute inset-0 flex flex-col items-center justify-center p-6 text-center opacity-0 scale-90 pointer-events-none">
      <div class="max-w-2xl bg-black/70 backdrop-blur-xl border border-purple-500/20 p-8 rounded-2xl shadow-[0_0_50px_rgba(168,85,247,0.15)]">
        <span class="text-xs font-mono text-cyan-400 tracking-widest"> Capa 2</span>
        <h2 class="text-3xl md:text-5xl font-bold text-white mt-2">INFORMACION Y DISEÑO PENDIENTE</h2>
        <p class="text-slate-300 mt-4 text-sm md:text-base leading-relaxed mb-6">
        
        </p>
      </div>
    </section>

  </main>

  <!-- VINCULAR EL ARCHIVO JS -->
  <script src="./src/main.js"></script>
</body>
</html>
